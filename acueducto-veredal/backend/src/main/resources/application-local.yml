spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/acueducto_veredal
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  multitenancy:
    header-name: X-Tenant-Id
